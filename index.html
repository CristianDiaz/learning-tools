<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>Mis juegos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, sans-serif;
    background: linear-gradient(160deg, #6c5ce7, #a29bfe); color: #fff;
    padding: max(24px, env(safe-area-inset-top)) 24px 24px;
  }
  h1 { text-align: center; font-size: 2.4rem; margin: 8px 0 28px; }
  .grid {
    display: grid; gap: 20px; max-width: 1000px; margin: 0 auto;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  }
  a.app {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; aspect-ratio: 1; border-radius: 28px; background: #fff; color: #2d3436;
    text-decoration: none; font-weight: 700; font-size: 1.2rem; text-align: center; padding: 12px;
    box-shadow: 0 8px 0 rgba(0,0,0,.15); transition: transform .1s;
  }
  a.app:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .emoji { font-size: 4rem; line-height: 1; }
  .vacio { text-align: center; opacity: .8; }
</style>
</head>
<body>
  <h1>🎮 Mis juegos</h1>
  <div class="grid" id="grid"></div>
<script>
  fetch('apps.json', { cache: 'no-cache' })
    .then(r => r.json())
    .then(apps => {
      const grid = document.getElementById('grid');
      if (!apps.length) { grid.outerHTML = '<p class="vacio">Todavía no hay juegos.</p>'; return; }
      for (const app of apps) {
        const a = document.createElement('a');
        a.className = 'app';
        a.href = app.path;
        a.innerHTML = `<span class="emoji">${app.emoji}</span><span></span>`;
        a.lastChild.textContent = app.name;
        grid.appendChild(a);
      }
    });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
